<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Mobilcard</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#008a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mobilcard">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --green:#008a2e;
    --card:#ffffff;
    --text:#111111;
    --muted:#6b7280;
    --blue:#1478a8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--green);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
    color:var(--text);
    min-height:100vh;
    min-height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:520px;margin:0 auto;padding:14px 16px 24px}
  .topbar{display:flex;justify-content:flex-end;padding-top:6px}
  .close{
    width:38px;height:38px;border:0;background:transparent;color:#fff;
    font-size:30px;line-height:1;cursor:pointer;opacity:.95
  }
  h1{
    color:#fff;font-size:27px;line-height:1.2;font-weight:700;
    margin:2px 0 18px;letter-spacing:-.2px
  }
  .card{
    background:var(--card);border-radius:14px;padding:20px;
    box-shadow:0 1px 2px rgba(0,0,0,.08);margin-bottom:18px
  }
  .logo{
    width:74px;height:52px;border:1.5px solid #7b1030;border-radius:9px;
    display:flex;align-items:center;justify-content:center;margin-bottom:14px;background:#fff
  }
  .logo svg{display:block}
  .title{font-size:23px;font-weight:700;margin:0 0 20px}
  .label{color:var(--muted);font-size:15px;margin:0 0 2px}
  .value{font-size:20px;font-weight:700;margin:0 0 18px}
  .value:last-child{margin-bottom:0}

  /* QR card */
  .qr-card{padding:26px 20px 22px;text-align:center}
  #qr{width:min(78vw,300px);height:min(78vw,300px);margin:0 auto;display:block}
  .btn{
    margin-top:26px;border:0;border-radius:26px;background:var(--blue);color:#fff;
    font-size:19px;font-weight:600;padding:14px 30px;cursor:pointer;font-family:inherit
  }
  .btn:active{transform:scale(.98)}

  /* Ride card */
  .ride-card{padding:0;overflow:hidden;background:#f4f7f9;display:none}
  .ride-card.show{display:block;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .ride-title{font-size:27px;font-weight:700;text-align:center;padding:26px 16px 8px;margin:0}
  .scene{position:relative;width:100%;aspect-ratio:1/1.05;overflow:hidden}
  .scene svg{position:absolute;inset:0;width:100%;height:100%}
  /* cabin travels along the cable: left->right, bottom->top */
  #cabin{
    animation:ride 9s linear infinite;
    transform-box:view-box;
  }
  @keyframes ride{
    from{transform:translate(0,0)}
    to{transform:translate(300px,-150px)}
  }
  #cabin .body{transform-origin:center top;animation:sway 2.6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
  @media (prefers-reduced-motion:reduce){
    #cabin,#cabin .body{animation:none}
  }
  .hint{color:#fff;opacity:.85;font-size:13px;text-align:center;margin:2px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><button class="close" aria-label="Close" onclick="reset()">&times;</button></div>
  <h1 id="head">Active journey <span id="timer">18:27</span></h1>

  <section class="card">
    <div class="logo" aria-label="Mobilcard logo">
      <svg width="52" height="30" viewBox="0 0 52 30" fill="#7b1030" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 28V4h6.4l6.2 12.6L20.8 4h6.3v24h-5.6V13.9l-4.9 9.8h-3.6l-4.9-9.8V28H2z"/>
        <circle cx="34" cy="9" r="3.1"/><circle cx="43.4" cy="4.6" r="2.5"/>
        <circle cx="43.4" cy="14" r="2.5"/><circle cx="34" cy="20.4" r="3.1"/>
        <circle cx="43.4" cy="24" r="2.5"/>
      </svg>
    </div>
    <p class="title">Mobilcard 3 days</p>
    <p class="label">Validated</p>
    <p class="value">03.08.2026, 17:45</p>
    <p class="label">Ticket holder</p>
    <p class="value">Yuliia Mazepa</p>
  </section>

  <section class="card qr-card" id="qrCard">
    <img id="qr" alt="Ticket QR code" src="qr.svg">
    <button class="btn" onclick="startRide()">Check validity</button>
  </section>

  <section class="card ride-card" id="rideCard">
    <p class="ride-title">Have a safe trip!</p>
    <div class="scene">
      <svg viewBox="0 0 400 420" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <rect width="400" height="420" fill="#f4f7f9"/>
        <!-- back peaks -->
        <polygon points="60,420 165,120 270,420" fill="#cfe4f2"/>
        <polygon points="250,420 355,150 460,420" fill="#cfe4f2"/>
        <!-- cable -->
        <line x1="-10" y1="330" x2="410" y2="120" stroke="#3f3f3f" stroke-width="4"/>
        <!-- front peaks -->
        <polygon points="120,420 235,215 350,420" fill="#5fa3c7"/>
        <polygon points="300,420 360,300 420,420" fill="#5fa3c7"/>
        <!-- cabin (starts bottom-left on the cable) -->
        <g id="cabin" transform="translate(0,0)">
          <g transform="translate(40,300)">
            <line x1="0" y1="0" x2="0" y2="14" stroke="#3f3f3f" stroke-width="3"/>
            <path d="M-16 30 L0 14 L16 30" fill="none" stroke="#3f3f3f" stroke-width="3"/>
            <g class="body">
              <rect x="-26" y="30" width="52" height="34" rx="3" fill="#3f3f3f"/>
              <rect x="-20" y="36" width="17" height="16" fill="#f4f7f9"/>
              <rect x="3" y="36" width="17" height="16" fill="#f4f7f9"/>
            </g>
          </g>
        </g>
      </svg>
    </div>
  </section>

  <p class="hint" id="hint">Prototype - tap "Check validity"</p>
</div>

<script>
  // countdown like in the app (mm:ss going up in the screenshots -> keep simple ticking)
  let base = 18*60 + 27;
  setInterval(() => {
    base++;
    const m = String(Math.floor(base/60)).padStart(2,'0');
    const s = String(base%60).padStart(2,'0');
    document.getElementById('timer').textContent = m + ':' + s;
  }, 1000);

  function startRide(){
    document.getElementById('qrCard').style.display = 'none';
    document.getElementById('rideCard').classList.add('show');
    document.getElementById('hint').textContent = 'Tap × to go back';
  }
  function reset(){
    document.getElementById('rideCard').classList.remove('show');
    document.getElementById('qrCard').style.display = '';
    document.getElementById('hint').textContent = 'Prototype - tap "Check validity"';
  }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
</script>
</body>
</html>
